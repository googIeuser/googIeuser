<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Musa Liquid Glass Banner</title>
<desc id="desc">Animated liquid glass profile banner for Musa, software developer.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#050816"/>
    <stop offset=".48" stop-color="#0b1024"/>
    <stop offset="1" stop-color="#12091f"/>
  </linearGradient>
  <radialGradient id="orbA">
    <stop offset="0" stop-color="#22d3ee" stop-opacity=".95"/>
    <stop offset=".55" stop-color="#2563eb" stop-opacity=".45"/>
    <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="orbB">
    <stop offset="0" stop-color="#f472b6" stop-opacity=".9"/>
    <stop offset=".55" stop-color="#a855f7" stop-opacity=".4"/>
    <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="glassStroke" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity=".75"/>
    <stop offset=".38" stop-color="#67e8f9" stop-opacity=".35"/>
    <stop offset=".72" stop-color="#f9a8d4" stop-opacity=".3"/>
    <stop offset="1" stop-color="#fff" stop-opacity=".12"/>
  </linearGradient>
  <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/>
    <stop offset=".5" stop-color="#fff" stop-opacity=".38"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <filter id="blur40"><feGaussianBlur stdDeviation="42"/></filter>
  <filter id="blur18"><feGaussianBlur stdDeviation="18"/></filter>
  <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="8" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="panelClip"><rect x="90" y="60" width="1020" height="240" rx="42"/></clipPath>
</defs>

<rect width="1200" height="360" fill="url(#bg)"/>

<g filter="url(#blur40)">
  <circle cx="180" cy="90" r="170" fill="url(#orbA)">
    <animate attributeName="cx" values="150;340;150" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="85;145;85" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1010" cy="270" r="200" fill="url(#orbB)">
    <animate attributeName="cx" values="1040;835;1040" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="270;175;270" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="650" cy="330" r="145" fill="#7c3aed" opacity=".28">
    <animate attributeName="cx" values="630;760;630" dur="11s" repeatCount="indefinite"/>
  </circle>
</g>

<rect x="90" y="60" width="1020" height="240" rx="42" fill="#ffffff" fill-opacity=".075" stroke="url(#glassStroke)" stroke-width="2"/>
<rect x="104" y="74" width="992" height="212" rx="34" fill="#ffffff" fill-opacity=".025" stroke="#ffffff" stroke-opacity=".08"/>

<g clip-path="url(#panelClip)">
  <path d="M-260 50 L-40 50 L350 320 L130 320 Z" fill="url(#shine)" opacity=".75">
    <animateTransform attributeName="transform" type="translate" values="0 0;1450 0" dur="7s" repeatCount="indefinite"/>
  </path>
  <ellipse cx="600" cy="62" rx="420" ry="26" fill="#fff" opacity=".08" filter="url(#blur18)"/>
</g>

<g font-family="Segoe UI,Inter,Arial,sans-serif" text-anchor="middle">
  <text x="600" y="156" fill="#ffffff" font-size="78" font-weight="700" letter-spacing="5" filter="url(#softGlow)">MUSA</text>
  <text x="600" y="204" fill="#dbeafe" font-size="24" font-weight="500" letter-spacing="3">SOFTWARE DEVELOPER</text>
  <text x="600" y="249" fill="#a5b4fc" font-size="17" letter-spacing="1.5">SYSTEM TOOLS  •  AUTOMATION  •  OPEN SOURCE</text>
</g>

<circle cx="122" cy="92" r="5" fill="#67e8f9">
  <animate attributeName="opacity" values=".35;1;.35" dur="2s" repeatCount="indefinite"/>
</circle>
<circle cx="140" cy="92" r="5" fill="#c084fc">
  <animate attributeName="opacity" values="1;.35;1" dur="2.4s" repeatCount="indefinite"/>
</circle>
<circle cx="158" cy="92" r="5" fill="#f9a8d4">
  <animate attributeName="opacity" values=".45;1;.45" dur="1.8s" repeatCount="indefinite"/>
</circle>
</svg>
