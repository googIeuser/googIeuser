<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="300" viewBox="0 0 1100 300" role="img" aria-labelledby="title desc">
<title id="title">NetWatcher Featured Project</title>
<desc id="desc">Animated glass project card for NetWatcher.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#07111f"/>
    <stop offset="1" stop-color="#160c25"/>
  </linearGradient>
  <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#22d3ee"/>
    <stop offset=".5" stop-color="#ffffff" stop-opacity=".22"/>
    <stop offset="1" stop-color="#f472b6"/>
  </linearGradient>
  <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#22d3ee"/>
    <stop offset=".55" stop-color="#818cf8"/>
    <stop offset="1" stop-color="#f472b6"/>
  </linearGradient>
  <radialGradient id="orb">
    <stop stop-color="#22d3ee" stop-opacity=".5"/>
    <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
  </radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="32"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="clip"><rect x="22" y="22" width="1056" height="256" rx="34"/></clipPath>
</defs>
<rect width="1100" height="300" rx="38" fill="#050816"/>
<rect x="22" y="22" width="1056" height="256" rx="34" fill="url(#bg)" stroke="url(#border)" stroke-width="2"/>
<g clip-path="url(#clip)">
  <circle cx="920" cy="80" r="170" fill="url(#orb)" filter="url(#blur)">
    <animate attributeName="cx" values="920;750;920" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle cx="130" cy="270" r="150" fill="#a855f7" opacity=".18" filter="url(#blur)">
    <animate attributeName="cy" values="270;180;270" dur="8s" repeatCount="indefinite"/>
  </circle>
</g>

<g transform="translate(70 58)">
  <rect width="92" height="92" rx="25" fill="#ffffff" fill-opacity=".075" stroke="#ffffff" stroke-opacity=".2"/>
  <circle cx="46" cy="46" r="25" fill="none" stroke="url(#wave)" stroke-width="5"/>
  <path d="M20 48 C30 48,30 32,40 32 S50 62,60 62 S68 42,76 42" fill="none" stroke="url(#wave)" stroke-width="5" stroke-linecap="round" filter="url(#glow)">
    <animate attributeName="stroke-dasharray" values="0 150;150 0;0 150" dur="4s" repeatCount="indefinite"/>
  </path>
</g>

<g font-family="Segoe UI,Inter,Arial,sans-serif">
  <text x="195" y="92" fill="#ffffff" font-size="42" font-weight="700">NetWatcher</text>
  <text x="197" y="128" fill="#67e8f9" font-size="17" letter-spacing="1.5">NETWORK MONITORING FOR WINDOWS</text>
  <text x="72" y="191" fill="#cbd5e1" font-size="19">A clean desktop utility for monitoring internet, gateway and DNS connectivity.</text>

  <rect x="72" y="218" width="120" height="34" rx="17" fill="#22d3ee" fill-opacity=".13" stroke="#22d3ee" stroke-opacity=".5"/>
  <text x="132" y="241" text-anchor="middle" fill="#a5f3fc" font-size="14">REAL-TIME</text>
  <rect x="206" y="218" width="116" height="34" rx="17" fill="#a855f7" fill-opacity=".13" stroke="#c084fc" stroke-opacity=".5"/>
  <text x="264" y="241" text-anchor="middle" fill="#e9d5ff" font-size="14">WINDOWS</text>
  <rect x="336" y="218" width="140" height="34" rx="17" fill="#f472b6" fill-opacity=".12" stroke="#f9a8d4" stroke-opacity=".5"/>
  <text x="406" y="241" text-anchor="middle" fill="#fce7f3" font-size="14">OPEN SOURCE</text>

  <text x="1010" y="239" text-anchor="end" fill="#94a3b8" font-size="15">View repository →</text>
</g>
</svg>