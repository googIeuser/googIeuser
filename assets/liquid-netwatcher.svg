<svg xmlns="http://www.w3.org/2000/svg" width="520" height="230" viewBox="0 0 520 230" role="img" aria-labelledby="title desc">
<title id="title">NetWatcher</title>
<desc id="desc">LOCAL WINDOWS NETWORK DIAGNOSTICS</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#07111f"/>
    <stop offset="1" stop-color="#160c25"/>
  </linearGradient>
  <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#22d3ee"/>
    <stop offset=".5" stop-color="#ffffff" stop-opacity=".2"/>
    <stop offset="1" stop-color="#f472b6"/>
  </linearGradient>
  <radialGradient id="orb">
    <stop stop-color="#22d3ee" stop-opacity=".42"/>
    <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
  </radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="26"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="clip"><rect x="12" y="12" width="496" height="206" rx="26"/></clipPath>
</defs>
<rect width="520" height="230" rx="28" fill="#050816"/>
<rect x="12" y="12" width="496" height="206" rx="26" fill="url(#bg)" stroke="url(#border)" stroke-width="1.7"/>
<g clip-path="url(#clip)">
  <circle cx="450" cy="34" r="112" fill="url(#orb)" filter="url(#blur)">
    <animate attributeName="cx" values="450;365;450" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="40" cy="230" r="92" fill="#f472b6" opacity=".12" filter="url(#blur)"/>
</g>

<g transform="translate(34 32)">
  <rect width="66" height="66" rx="19" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".18"/>
  
<circle cx="33" cy="33" r="20" fill="none" stroke="url(#border)" stroke-width="3.5"/>
<path d="M12 35 C19 35,19 23,26 23 S34 45,41 45 S47 31,54 31" fill="none" stroke="#67e8f9" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)"/>

</g>

<g font-family="Segoe UI,Inter,Arial,sans-serif">
  <text x="119" y="58" fill="#ffffff" font-size="27" font-weight="700">NetWatcher</text>
  <text x="120" y="82" fill="#22d3ee" font-size="11.5" font-weight="600" letter-spacing="1.1">LOCAL WINDOWS NETWORK DIAGNOSTICS</text>
  <text x="34" y="127" fill="#cbd5e1" font-size="14.5">Latency, jitter, packet loss and outage history</text>
  <text x="34" y="151" fill="#cbd5e1" font-size="14.5">with local ISP-ready reports and exports.</text>
  <rect x="34" y="186" width="86" height="28" rx="14" fill="#22d3ee" fill-opacity=".12" stroke="#22d3ee" stroke-opacity=".45"/><text x="77.0" y="205" text-anchor="middle" fill="#e2e8f0" font-size="11">FLUTTER</text>
  <rect x="130" y="186" width="62" height="28" rx="14" fill="#22d3ee" fill-opacity=".12" stroke="#22d3ee" stroke-opacity=".45"/><text x="161.0" y="205" text-anchor="middle" fill="#e2e8f0" font-size="11">RUST</text>
  <rect x="202" y="186" width="86" height="28" rx="14" fill="#22d3ee" fill-opacity=".12" stroke="#22d3ee" stroke-opacity=".45"/><text x="245.0" y="205" text-anchor="middle" fill="#e2e8f0" font-size="11">WINDOWS</text>
  <text x="486" y="205" text-anchor="end" fill="#94a3b8" font-size="11.5">View repository →</text>
</g>
</svg>
