<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="370" viewBox="0 0 1100 370" role="img" aria-labelledby="title desc">
<title id="title">Musa Developer Terminal</title>
<desc id="desc">Animated glass terminal introducing Musa and his current development focus.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#09101f"/>
    <stop offset="1" stop-color="#130b22"/>
  </linearGradient>
  <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#67e8f9" stop-opacity=".7"/>
    <stop offset=".5" stop-color="#fff" stop-opacity=".22"/>
    <stop offset="1" stop-color="#f9a8d4" stop-opacity=".55"/>
  </linearGradient>
  <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#fff" stop-opacity="0"/>
    <stop offset=".5" stop-color="#fff" stop-opacity=".15"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="clip"><rect x="25" y="25" width="1050" height="320" rx="28"/></clipPath>
</defs>
<rect width="1100" height="370" rx="34" fill="#050816"/>
<rect x="25" y="25" width="1050" height="320" rx="28" fill="url(#bg)" stroke="url(#stroke)" stroke-width="2"/>
<g clip-path="url(#clip)">
  <circle cx="980" cy="30" r="180" fill="#7c3aed" opacity=".16">
    <animate attributeName="cx" values="980;850;980" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="150" cy="350" r="150" fill="#0891b2" opacity=".12">
    <animate attributeName="cy" values="350;250;350" dur="8s" repeatCount="indefinite"/>
  </circle>
  <rect x="-320" y="25" width="270" height="320" fill="url(#scan)" transform="skewX(-18)">
    <animate attributeName="x" values="-320;1400" dur="8s" repeatCount="indefinite"/>
  </rect>
</g>
<circle cx="62" cy="60" r="7" fill="#fb7185"/>
<circle cx="86" cy="60" r="7" fill="#facc15"/>
<circle cx="110" cy="60" r="7" fill="#4ade80"/>
<text x="550" y="66" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI,Arial" font-size="14">musa@github — developer terminal</text>

<g font-family="JetBrains Mono,Consolas,monospace" font-size="19">
  <text x="68" y="113" fill="#67e8f9">musa@github:~$ <tspan fill="#f8fafc">whoami</tspan></text>
  <text x="68" y="146" fill="#cbd5e1">Musa — Software Developer from Türkiye</text>

  <text x="68" y="190" fill="#67e8f9">musa@github:~$ <tspan fill="#f8fafc">cat current_focus.txt</tspan></text>
  <text x="68" y="223" fill="#cbd5e1">Desktop utilities • Android tools • diagnostics • performance</text>

  <text x="68" y="267" fill="#67e8f9">musa@github:~$ <tspan fill="#f8fafc">cat principles.txt</tspan></text>
  <text x="68" y="300" fill="#cbd5e1">Local-first • Honest metrics • Useful interfaces • Open source</text>

  <text x="68" y="332" fill="#67e8f9">musa@github:~$ <tspan fill="#f8fafc">echo "Code. Learn. Build. Repeat."</tspan></text>
  <rect x="660" y="314" width="11" height="23" rx="2" fill="#f9a8d4" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</g>
</svg>
