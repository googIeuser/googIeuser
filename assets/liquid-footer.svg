<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-labelledby="title">
<title id="title">Animated liquid glass footer</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#050816"/>
    <stop offset=".5" stop-color="#11102a"/>
    <stop offset="1" stop-color="#050816"/>
  </linearGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#22d3ee" stop-opacity="0"/>
    <stop offset=".25" stop-color="#22d3ee"/>
    <stop offset=".55" stop-color="#a855f7"/>
    <stop offset=".8" stop-color="#f472b6"/>
    <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
  </linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="150" rx="28" fill="url(#bg)"/>
<path d="M0 105 C170 55,300 135,470 82 S790 48,1200 98" fill="none" stroke="url(#line)" stroke-width="3" opacity=".75" filter="url(#glow)">
  <animate attributeName="d"
    values="M0 105 C170 55,300 135,470 82 S790 48,1200 98;
            M0 92 C190 140,310 48,500 92 S820 130,1200 72;
            M0 105 C170 55,300 135,470 82 S790 48,1200 98"
    dur="9s" repeatCount="indefinite"/>
</path>
<text x="600" y="65" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI,Arial" font-size="18" letter-spacing="2">CODE  •  LEARN  •  BUILD  •  REPEAT</text>
<circle cx="600" cy="102" r="4" fill="#67e8f9" filter="url(#glow)">
  <animate attributeName="r" values="3;6;3" dur="2s" repeatCount="indefinite"/>
</circle>
</svg>