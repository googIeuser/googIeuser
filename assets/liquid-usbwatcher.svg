<svg xmlns="http://www.w3.org/2000/svg" width="520" height="230" viewBox="0 0 520 230" role="img" aria-labelledby="title desc">
<title id="title">USBWatcher</title>
<desc id="desc">WINDOWS USB INSPECTOR</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#07111f"/>
    <stop offset="1" stop-color="#160c25"/>
  </linearGradient>
  <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#67e8f9"/>
    <stop offset=".5" stop-color="#ffffff" stop-opacity=".2"/>
    <stop offset="1" stop-color="#a78bfa"/>
  </linearGradient>
  <radialGradient id="orb">
    <stop stop-color="#67e8f9" stop-opacity=".42"/>
    <stop offset="1" stop-color="#67e8f9" stop-opacity="0"/>
  </radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="26"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="clip"><rect x="12" y="12" width="496" height="206" rx="26"/></clipPath>
</defs>
<rect width="520" height="230" rx="28" fill="#050816"/>
<rect x="12" y="12" width="496" height="206" rx="26" fill="url(#bg)" stroke="url(#border)" stroke-width="1.7"/>
<g clip-path="url(#clip)">
  <circle cx="450" cy="34" r="112" fill="url(#orb)" filter="url(#blur)">
    <animate attributeName="cx" values="450;365;450" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="40" cy="230" r="92" fill="#a78bfa" opacity=".12" filter="url(#blur)"/>
</g>

<g transform="translate(34 32)">
  <rect width="66" height="66" rx="19" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".18"/>
  
<path d="M33 12 V47 M33 12 L26 20 M33 12 L40 20 M33 31 L20 31 M20 31 L20 42 M33 39 L46 39 M46 39 L46 27" fill="none" stroke="#67e8f9" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
<circle cx="20" cy="46" r="4" fill="#f472b6"/>
<rect x="42" y="19" width="8" height="8" rx="2" fill="#a78bfa"/>

</g>

<g font-family="Segoe UI,Inter,Arial,sans-serif">
  <text x="119" y="58" fill="#ffffff" font-size="27" font-weight="700">USBWatcher</text>
  <text x="120" y="82" fill="#67e8f9" font-size="11.5" font-weight="600" letter-spacing="1.1">WINDOWS USB INSPECTOR</text>
  <text x="34" y="127" fill="#cbd5e1" font-size="14.5">Negotiated speed, descriptors, identifiers</text>
  <text x="34" y="151" fill="#cbd5e1" font-size="14.5">and connection paths reported by Windows.</text>
  <rect x="34" y="186" width="86" height="28" rx="14" fill="#67e8f9" fill-opacity=".12" stroke="#67e8f9" stroke-opacity=".45"/><text x="77.0" y="205" text-anchor="middle" fill="#e2e8f0" font-size="11">FLUTTER</text>
  <rect x="130" y="186" width="62" height="28" rx="14" fill="#67e8f9" fill-opacity=".12" stroke="#67e8f9" stroke-opacity=".45"/><text x="161.0" y="205" text-anchor="middle" fill="#e2e8f0" font-size="11">RUST</text>
  <rect x="202" y="186" width="54" height="28" rx="14" fill="#67e8f9" fill-opacity=".12" stroke="#67e8f9" stroke-opacity=".45"/><text x="229.0" y="205" text-anchor="middle" fill="#e2e8f0" font-size="11">USB</text>
  <text x="486" y="205" text-anchor="end" fill="#94a3b8" font-size="11.5">View repository →</text>
</g>
</svg>
